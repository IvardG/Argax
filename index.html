<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Enfants d’Argax</title>

  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e0e14;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ===== FOND ÉTOILÉ ===== */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 300%;
      height: 300%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(#ffffff 1.2px, transparent 1.2px),
        radial-gradient(#aee7ff 1px, transparent 1px),
        radial-gradient(#ffffff 0.8px, transparent 0.8px),
        radial-gradient(#ffffff 1.5px, transparent 1.5px);
      background-size: 400px 400px, 600px 600px, 800px 800px, 1200px 1200px;
      background-position: 0 0, 0 0, 0 0, 0 0;
      animation: moveStars1 200s linear infinite,
                 moveStars2 300s ease-in-out infinite,
                 moveStars3 400s linear infinite,
                 sparkle 6s ease-in-out infinite;
      opacity: 0.5;
    }

    @keyframes moveStars1 {
      0% { background-position: 0 0, 0 0, 0 0, 0 0; }
      100% { background-position: -1000px -1000px, -600px -400px, -800px -300px, -400px -600px; }
    }

    @keyframes moveStars2 {
      0% { background-position: 0 0, 0 0, 0 0, 0 0; }
      100% { background-position: -300px -700px, -500px -200px, -200px -500px, -600px -100px; }
    }

    @keyframes moveStars3 {
      0% { background-position: 0 0, 0 0, 0 0, 0 0; }
      100% { background-position: -500px -400px, -300px -600px, -600px -300px, -200px -700px; }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.18; filter: brightness(1); }
      50% { opacity: 0.5; filter: brightness(1.6); }
    }

    /* ===== LOGO CENTRAL ===== */
    .landing-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -60%);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    .logo-link {
      display: inline-block;
      cursor: pointer;
    }

    .logo-pulse {
      width: clamp(140px, 25vw, 240px);
      height: auto;
      animation: pulse 4s ease-in-out infinite;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.3); }
    }

    .logo-link:hover .logo-pulse {
      transform: scale(1.08);
      filter: brightness(1.6);
    }

    /* ===== FONDU DE SORTIE ===== */
    .fade-out {
      animation: fadeOut 1.5s ease forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }

    /* Écran noir de transition */
    .blackout {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0e0e14;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .blackout.active {
      opacity: 1;
      pointer-events: all;
    }

  </style>
</head>

<body>
  <!-- Fond étoilé -->
  <div class="stars"></div>

  <!-- Logo central -->
  <div class="landing-container">
    <a class="logo-link">
      <img src="lesEnfantsdArgax.svg" alt="Les Enfants d’Argax" class="logo-pulse">
    </a>
  </div>

  <!-- Voile de transition -->
  <div class="blackout"></div>

  <!-- Musique d’ambiance -->
  <audio id="introSound" autoplay loop>
    <source src="Argax_Intro.mp3" type="audio/mpeg">
    Votre navigateur ne supporte pas l’audio HTML5.
  </audio>

  <script>
    const audio = document.getElementById('introSound');
    const logo = document.querySelector('.logo-link');
    const blackout = document.querySelector('.blackout');

    // === FONDU D’ENTRÉE SONORE ===
    audio.volume = 0;
    const fadeDuration = 4000;
    const targetVolume = 0.4;
    const step = targetVolume / (fadeDuration / 100);

    const fadeIn = setInterval(() => {
      if (audio.volume < targetVolume) {
        audio.volume = Math.min(audio.volume + step, targetVolume);
      } else {
        clearInterval(fadeIn);
      }
    }, 100);

    // === TRANSITION VERS PAGE_1 ===
    logo.addEventListener('click', () => {
      // Animation de sortie du logo
      document.querySelector('.landing-container').classList.add('fade-out');
      blackout.classList.add('active');

      // Fondu sonore
      const fadeOut = setInterval(() => {
        if (audio.volume > 0.02) {
          audio.volume -= 0.02;
        } else {
          clearInterval(fadeOut);
        }
      }, 100);

      // Redirection après 1.5 s
      setTimeout(() => {
        window.location.href = 'page_1.html';
      }, 1500);
    });
  </script>
</body>
</html>
