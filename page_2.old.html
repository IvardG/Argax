<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Enfants d’Argax — Transmission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fond étoilé -->
  <div class="stars"></div>

  <!-- Header fixe -->
  <header class="header">
    <div class="logo-container">
      <img src="lesEnfantsdArgax.svg" alt="Logo Les Enfants d’Argax" class="logo">
    </div>
    <div class="separator"></div>
  </header>

  <main class="content">
    <!-- Transmission texte -->
    <div class="transmission-container">
      <div id="line1" class="transmission">Réponds si tu es prêt.</div>
      <div id="line2" class="transmission special">Fréquence 7-4-9.</div>
      <div id="line3" class="transmission">Fin de transmission.</div>
    </div>

    <!-- Oscilloscope -->
  <!-- Visualisation SVG  -->
<svg id="oscilloscope" viewBox="0 0 220 220" aria-hidden="true" focusable="false">
  <!-- cercle de base (anneau discret) -->
  <circle id="osc-base" cx="110" cy="110" r="70" fill="none" stroke="rgba(212,175,127,0.12)" stroke-width="8"/>
  <!-- anneau animé -->
  <circle id="osc-ring" cx="110" cy="110" r="70" fill="none" stroke="#d4af7f" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="440" stroke-dashoffset="0" style="filter: drop-shadow(0 0 12px rgba(212,175,127,0.25));" />
</svg>

  </main>

  <!-- Footer fixe -->
  <footer class="footer">
    <div class="separator"></div>
    <p>&copy; 3311 – Les Enfants d’Argax. Aucun QG. Juste des étoiles.</p>
  </footer>

  <!-- Audio -->
  <audio id="introSound" src="Argax_intro.mp3" autoplay loop></audio>
  <audio id="clickSound" src="clic.mp3"></audio>
  <audio id="messageSound" src="les-enfants-d-argax.mp3"></audio>

  <!-- Script externe -->
  <script src="page_2.js"></script>
</body>
</html>
