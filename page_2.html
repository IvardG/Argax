<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Enfants d’Argax — Transmission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fond étoilé -->
  <div class="stars"></div>

  <!-- Header fixe -->
  <header class="header">
    <div class="logo-container">
      <img src="lesEnfantsdArgax.svg" alt="Logo Les Enfants d’Argax" class="logo">
    </div>
    <div class="separator"></div>
  </header>

   <main class="content">
    <!-- Transmission texte -->
    <div class="transmission-container">
      <div id="line1" class="transmission">Réponds si tu es prêt.</div>
      <div id="line2" class="transmission special">Fréquence 7-4-9.</div>
      <div id="line3" class="transmission">Fin de transmission.</div>
    </div>

    <!-- Spirale d'Argax -->
    <div id="spirale-container">
      <svg id="spirale-argax" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g id="spiral-group" filter="url(#glow)">
          <path id="spiral-path" d="" stroke="#d4af7f" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </main>
  <!-- Footer fixe -->
  <footer class="footer">
    <div class="separator"></div>
    <p>&copy; 3312 – Les Enfants d’Argax. Aucun QG. Juste des étoiles.</p>
  </footer>

  <!-- Audio -->
  <audio id="introSound" src="Argax_intro.mp3" autoplay loop></audio>
  <audio id="clickSound" src="clic.mp3"></audio>
  <audio id="messageSound" src="les-enfants-d-argax.mp3"></audio>

  <!-- Script externe -->
  <script src="page_2.js"></script>
</body>
</html>
